/* ================= 状态与逻辑 ================= */
let qIndex = 0;
let scores = {};
const KEYS = ANIMALS.map(a => a.key);

function showPage(id) {
  ["page-cover","page-quiz","page-result"].forEach(p =>
    document.getElementById(p).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startQuiz() {
  qIndex = 0;
  scores = {};
  showPage("page-quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[qIndex];
  document.getElementById("progress-text").textContent = `第 ${qIndex + 1} / ${QUESTIONS.length} 题`;
  document.getElementById("bar-fill").style.width = ((qIndex) / QUESTIONS.length * 100) + "%";
  const card = document.getElementById("q-card");
  const letters = ["A","B","C","D"];
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  card.innerHTML = `
    <div class="q-no">QUESTION ${String(qIndex + 1).padStart(2, "0")}</div>
    <div class="q-title">${q.q}</div>
    ${q.opts.map((o, i) => `
      <button class="opt" onclick="answer(${i})">
        <span class="tag">${letters[i]}</span><span>${o.t}</span>
      </button>`).join("")}
  `;
}

function answer(i) {
  const opt = QUESTIONS[qIndex].opts[i];
  opt.a.forEach(k => { scores[k] = (scores[k] || 0) + 1; });
  qIndex++;
  document.getElementById("bar-fill").style.width = (qIndex / QUESTIONS.length * 100) + "%";
  if (qIndex < QUESTIONS.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  // 找最高分（平分随机决胜）
  let best = KEYS.filter(k => scores[k] === Math.max(...KEYS.map(x => scores[x] || 0)));
  const winner = ANIMALS.find(a => a.key === best[Math.floor(Math.random() * best.length)]);
  const s = winner.stats;

  const bottleSVG = `
  <svg class="bottle" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
    <rect x="48" y="4" width="24" height="16" rx="4" fill="#c9a86a"/>
    <path d="M44 20 L76 20 L84 52 L84 150 Q84 162 72 162 L48 162 Q36 162 36 150 L36 52 Z"
      fill="rgba(255,255,255,.55)" stroke="#c9a86a" stroke-width="3"/>
    <path d="M40 96 Q60 88 80 96 L80 150 Q80 158 72 158 L48 158 Q40 158 40 150 Z"
      fill="${winner.color}" opacity=".85"/>
    <rect x="44" y="66" width="32" height="24" rx="4" fill="#fff" stroke="#e0c79a" stroke-width="2"/>
    <text x="60" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#a5822f">尿样</text>
    <circle cx="52" cy="120" r="4" fill="#fff" opacity=".6"/>
    <circle cx="68" cy="136" r="3" fill="#fff" opacity=".5"/>
    <circle cx="58" cy="146" r="2.5" fill="#fff" opacity=".5"/>
  </svg>`;

  document.getElementById("result-card").innerHTML = `
    <div class="result-kicker">★ 鉴 定 结 果 ★</div><br>
    <div class="result-emoji">${winner.emoji}</div>
    <div class="result-name">${winner.name}</div>
    <div><span class="result-title" style="background:linear-gradient(135deg, ${winner.color}, #d6336c)">${winner.title}</span></div>
    ${bottleSVG}
    <div class="result-rank">综合匹配率 ${(70 + Math.random() * 29).toFixed(1)}% · 本命尿型已锁定，无法退换</div>

    <div class="section">
      <h3>💧 尿的档案</h3>
      <p>${winner.desc}</p>
    </div>
    <div class="section">
      <h3>🔮 尿格解读</h3>
      <p>${winner.read}</p>
    </div>
    <div class="stats">
      ${Object.entries(s).map(([k, v], i) => `
        <div class="stat-row">
          <div class="stat-label">${k}</div>
          <div class="stat-bar"><div class="stat-fill" style="width:${v}%; background:linear-gradient(90deg, ${winner.color}, #d6336c); animation-delay:${i * 0.12}s"></div></div>
          <div class="stat-val">${v}</div>
        </div>`).join("")}
    </div>
    <div class="btn-row">
      <button class="btn-sec" onclick="startQuiz()">再测一次</button>
      <button class="btn-sec" onclick="shareResult('${winner.name}')">复制结果炫耀</button>
    </div>
    <div class="share-note">本次鉴定由轮回管理总局尿型科友情提供 · 24 种尿型 · 抽到熊猫尿的请自觉炫耀</div>
  `;
  showPage("page-result");
}

function shareResult(name) {
  const text = `我在「重生之你是什么动物的尿」测试中，鉴定为本命尿型：${name}！快来测测你是什么尿 →`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert("已复制！快去粘贴给朋友，让他们也来鉴定尿型～"))
      .catch(() => alert(text));
  } else { alert(text); }
}
